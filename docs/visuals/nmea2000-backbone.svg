ad4">Heading source</text><text x="408" y="252" font-size="16" fill="#dce7f4">Heading data</text><rect x="660" y="190" width="200" height="120" rx="12" fill="#15283d" stroke="#5eead4"/><text x="678" y="222" font-size="20" fill="#5eead4">Display / control</text><text x="678" y="252" font-size="16" fill="#dce7f4">Selected data source</text><rect x="900" y="190" width="210" height="120" rx="12" fill="#15283d" stroke="#5eead4"/><text x="918" y="222" font-size="20" fill="#5eead4">Gateway</text><text x="918" y="252" font-size="16" fill="#dce7f4">Data conversion</text><path d="M600 380V510" stroke="#ffbd69" stroke-width="4"/><text x="420" y="548" font-size="17" fill="#ffbd69">Network power feed · follow device installation instructions</text><text x="335" y="425" font-size="16" fill="#a9bbd2">T-connectors along the backbone; device drops branch from the bus.</text><path d="M40 617H1160" stroke="#344960"/><text x="40" y="651" font-size="16" fill="#a9bbd2">Educational explanation · no vessel deployment, sea trial or measured result is claimed.</text></g></svg>