<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Integration fault isolation</title><desc id="desc">A structured learning workflow for missing or conflicting navigation data.. Educational diagram, not an implemented vessel.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5eead4"/></marker></defs><rect width="1200" height="690" rx="18" fill="#0b1626"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#5eead4">USV SYSTEMS INTEGRATION · STUDY NOTES</text><text x="40" y="92" font-size="30" fill="#dce7f4">Integration fault isolation</text><text x="40" y="132" font-size="17" fill="#a9bbd2">A structured learning workflow for missing or conflicting navigation data.</text><rect x="40" y="205" width="330" height="130" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="237" font-size="20" fill="#5eead4">1. Observe the symptom</text><text x="58" y="267" font-size="16" fill="#dce7f4">What is missing or inconsistent?</text><text x="58" y="292" font-size="16" fill="#dce7f4">Record time, source and context.</text><path d="M370 270L425 270" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="425" y="205" width="330" height="130" rx="12" fill="#15283d" stroke="#5eead4"/><text x="443" y="237" font-size="20" fill="#5eead4">2. Make operation safe</text><text x="443" y="267" font-size="16" fill="#dce7f4">Apply the defined operating limits.</text><text x="443" y="292" font-size="16" fill="#dce7f4">Confirm who holds control authority.</text><path d="M755 270L815 270" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="815" y="205" width="345" height="130" rx="12" fill="#15283d" stroke="#5eead4"/><text x="833" y="237" font-size="20" fill="#5eead4">3. Trace the data path</text><text x="833" y="267" font-size="16" fill="#dce7f4">Source → bus → gateway → consumer</text><text x="833" y="292" font-size="16" fill="#dce7f4">Check validity as well as delivery.</text><rect x="40" y="410" width="330" height="145" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="442" font-size="20" fill="#5eead4">6. Verify and document</text><text x="58" y="472" font-size="16" fill="#dce7f4">Re-test the affected function.</text><text x="58" y="497" font-size="16" fill="#dce7f4">Keep the evidence and configuration.</text><path d="M425 480L370 480" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="425" y="410" width="330" height="145" rx="12" fill="#15283d" stroke="#5eead4"/><text x="443" y="442" font-size="20" fill="#5eead4">5. Apply a controlled fix</text><text x="443" y="472" font-size="16" fill="#dce7f4">Change the isolated cause.</text><text x="443" y="497" font-size="16" fill="#dce7f4">Keep a rollback path.</text><path d="M815 480L755 480" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="815" y="410" width="345" height="145" rx="12" fill="#15283d" stroke="#5eead4"/><text x="833" y="442" font-size="20" fill="#5eead4">4. Prove the fault boundary</text><text x="833" y="472" font-size="16" fill="#dce7f4">Separate transport and data meaning.</text><text x="833" y="497" font-size="16" fill="#dce7f4">Compare evidence across interfaces.</text><path d="M987 335L987 410" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M40 617H1160" stroke="#344960"/><text x="40" y="651" font-size="16" fill="#a9bbd2">Educational explanation · no vessel deployment, sea trial or measured result is claimed.</text></g></svg>