<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">Vessel network: separate data responsibilities</title><desc id="desc">Logical segmentation is an example; it does not define an installed network.. Educational diagram, not an implemented vessel.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5eead4"/></marker></defs><rect width="1200" height="690" rx="18" fill="#0b1626"/><g font-family="Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#5eead4">USV SYSTEMS INTEGRATION · STUDY NOTES</text><text x="40" y="92" font-size="30" fill="#dce7f4">Vessel network: separate data responsibilities</text><text x="40" y="132" font-size="17" fill="#a9bbd2">Logical segmentation is an example; it does not define an installed network.</text><rect x="40" y="200" width="235" height="110" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="232" font-size="20" fill="#5eead4">Navigation sources</text><text x="58" y="262" font-size="16" fill="#dce7f4">Measurements / validity</text><rect x="40" y="350" width="235" height="110" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="382" font-size="20" fill="#5eead4">Cameras</text><text x="58" y="412" font-size="16" fill="#dce7f4">Video stream</text><rect x="40" y="500" width="235" height="95" rx="12" fill="#15283d" stroke="#5eead4"/><text x="58" y="532" font-size="20" fill="#5eead4">Management</text><text x="58" y="562" font-size="16" fill="#dce7f4">Logs / configuration</text><path d="M275 255L370 255" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 405L370 405" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 547L370 547" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="370" y="200" width="290" height="395" rx="12" fill="#15283d" stroke="#5eead4"/><text x="388" y="232" font-size="20" fill="#5eead4">Onboard network</text><text x="388" y="262" font-size="16" fill="#dce7f4">Control-data path</text><text x="388" y="287" font-size="16" fill="#dce7f4">Navigation-data path</text><text x="388" y="312" font-size="16" fill="#dce7f4">Video-data path</text><text x="388" y="337" font-size="16" fill="#dce7f4">Management-data path</text><text x="388" y="362" font-size="16" fill="#dce7f4"></text><text x="388" y="387" font-size="16" fill="#dce7f4">Routing / policy / QoS</text><text x="388" y="412" font-size="16" fill="#dce7f4">VLAN alone is not security</text><path d="M660 275L740 275" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="200" width="250" height="145" rx="12" fill="#15283d" stroke="#5eead4"/><text x="758" y="232" font-size="20" fill="#5eead4">Control function</text><text x="758" y="262" font-size="16" fill="#dce7f4">Authority and limits</text><text x="758" y="287" font-size="16" fill="#dce7f4">State / health feedback</text><path d="M660 490L740 490" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="420" width="250" height="145" rx="12" fill="#15283d" stroke="#5eead4"/><text x="758" y="452" font-size="20" fill="#5eead4">Communication links</text><text x="758" y="482" font-size="16" fill="#dce7f4">Primary / backup paths</text><text x="758" y="507" font-size="16" fill="#dce7f4">Application-level checks</text><path d="M995 490L1135 490" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/><text x="1010" y="430" font-size="17" fill="#dce7f4">Remote</text><text x="1010" y="455" font-size="17" fill="#dce7f4">operator</text><text x="740" y="380" font-size="16" fill="#ffbd69">Link up does not prove valid navigation data.</text><path d="M40 617H1160" stroke="#344960"/><text x="40" y="651" font-size="16" fill="#a9bbd2">Educational explanation · no vessel deployment, sea trial or measured result is claimed.</text></g></svg>